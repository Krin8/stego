name: stego
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - torchaudio
  - pytorch-cuda=12.1
  - numpy<2.0.0
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - pandas
  - pillow
  - tqdm
  - pip:
      - pytorch-lightning>=2.0.0
      - torchmetrics>=1.0.0
      - hydra-core>=1.3.2
      - omegaconf>=2.3.0
      - timm>=0.9.12
      - open_clip_torch>=2.20.0
      - transformers>=4.30.0
      - pydicom>=2.4.0
      - SimpleITK>=2.2.0
      - opencv-contrib-python>=4.8.0
      - scikit-image>=0.21.0
      - kornia>=0.7.0
      - einops>=0.6.0
      - tensorboard>=2.13.0
      - huggingface_hub>=0.19.0
      - wget>=3.2
      - safetensors>=0.4.0
